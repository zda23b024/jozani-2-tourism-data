services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PGDATABASE:-zanzibar_booking_data}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    env_file:
      - .env
    environment:
      HEADLESS: "true"
      PGHOST: db
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-zanzibar_booking_data}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-change_this_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./output:/app/output
      - ./browser:/app/browser
    command: ["python", "main.py"]
    stdin_open: true
    tty: true

  booking-browser:
    build: .
    env_file:
      - .env
    environment:
      HEADLESS: "false"
      DISPLAY: ":99"
      PGHOST: db
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-zanzibar_booking_data}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-change_this_password}
      XVFB_SCREEN: "1440x1000x24"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6080:6080"
      - "5900:5900"
    volumes:
      - ./output:/app/output
      - ./browser:/app/browser
    command: ["python", "main.py"]
    stdin_open: true
    tty: true

  dashboard:
    build:
      context: ./monitoring_dashboard
    environment:
      PGHOST: ${DASHBOARD_PGHOST:-db}
      PGPORT: ${DASHBOARD_PGPORT:-5432}
      PGDATABASE: ${DASHBOARD_PGDATABASE:-${PGDATABASE:-zanzibar_booking_data}}
      PGUSER: ${DASHBOARD_DB_USER:-${PGUSER:-postgres}}
      PGPASSWORD: ${DASHBOARD_DB_PASSWORD:-${PGPASSWORD:-change_this_password}}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-30}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  postgres_data:
